<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - Tzura Steak House</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #333;
    }

    .card-title {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .number {
      font-size: 38px;
      font-weight: bold;
    }

    .chart-box {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #333;
      margin-bottom: 30px;
    }

    .chart-box h2 {
      margin-top: 0;
      margin-bottom: 5px;
    }

    .chart-subtitle {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 350px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .events {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #333;
    }

    .events h2 {
      margin-top: 0;
    }

    .event {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid #333;
    }

    .event:last-child {
      border-bottom: none;
    }

    .event-date {
      color: #aaa;
      font-size: 14px;
    }

    .refresh {
      margin-top: 25px;
      padding: 12px 20px;
      background: #b08d57;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .refresh:hover {
      opacity: 0.9;
    }

    .loading {
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Tzura Steak House</h1>

  <div class="subtitle">
    Dashboard de NFC
  </div>


  <!-- TARJETAS -->

  <div class="cards">

    <div class="card">
      <div class="card-title">📲 Taps totales</div>
      <div class="number" id="totalTaps">-</div>
    </div>

    <div class="card">
      <div class="card-title">📅 Taps hoy</div>
      <div class="number" id="todayTaps">-</div>
    </div>

    <div class="card">
      <div class="card-title">📆 Últimos 7 días</div>
      <div class="number" id="weekTaps">-</div>
    </div>

    <div class="card">
      <div class="card-title">📈 Últimos 30 días</div>
      <div class="number" id="monthTaps">-</div>
    </div>

  </div>


  <!-- GRÁFICO -->

  <div class="chart-box">

    <h2>📊 Taps por día</h2>

    <div class="chart-subtitle">
      Actividad de los últimos 30 días
    </div>

    <div class="chart-container">
      <canvas id="tapsChart"></canvas>
    </div>

  </div>


  <!-- ÚLTIMOS TAPS -->

  <div class="events">

    <h2>Últimos taps</h2>

    <div id="eventsList">
      <div class="loading">
        Cargando...
      </div>
    </div>

    <button class="refresh" onclick="loadData()">
      🔄 Actualizar
    </button>

  </div>

</div>


<!-- CHART.JS -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>

const SUPABASE_URL =
  "https://qcvhxrudzjlgqlhvnkkl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OpfoWwYD2lvC9dVTT_UT8A_Bvz_GKRw";

const RESTAURANT =
  "Tzura Steak House";


let tapsChart = null;


async function loadData() {

  try {

    const response = await fetch(

      `${SUPABASE_URL}/rest/v1/nfc_events?restaurant=eq.${encodeURIComponent(RESTAURANT)}&event=eq.nfc_tap&order=created_at.desc`,

      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }

    );


    const events = await response.json();


    if (!Array.isArray(events)) {
      throw new Error("No se pudieron cargar los datos");
    }


    /*
      FECHAS
    */

    const now = new Date();


    const todayStart = new Date();

    todayStart.setHours(0, 0, 0, 0);


    const weekStart = new Date();

    weekStart.setDate(now.getDate() - 7);


    const monthStart = new Date();

    monthStart.setDate(now.getDate() - 30);


    /*
      FILTROS
    */

    const todayEvents =
      events.filter(event =>
        new Date(event.created_at) >= todayStart
      );


    const weekEvents =
      events.filter(event =>
        new Date(event.created_at) >= weekStart
      );


    const monthEvents =
      events.filter(event =>
        new Date(event.created_at) >= monthStart
      );


    /*
      TARJETAS
    */

    document.getElementById("totalTaps").textContent =
      events.length;


    document.getElementById("todayTaps").textContent =
      todayEvents.length;


    document.getElementById("weekTaps").textContent =
      weekEvents.length;


    document.getElementById("monthTaps").textContent =
      monthEvents.length;


    /*
      GRÁFICO
    */

    createChart(events);


    /*
      LISTA DE ÚLTIMOS TAPS
    */

    const list =
      document.getElementById("eventsList");


    if (events.length === 0) {

      list.innerHTML =
        "<p>No hay taps registrados todavía.</p>";

      return;
    }


    list.innerHTML =
      events
        .slice(0, 20)
        .map(event => {

          const date =
            new Date(event.created_at);

          return `

            <div class="event">

              <div>
                📲 NFC tap
              </div>

              <div class="event-date">
                ${date.toLocaleString("es-ES")}
              </div>

            </div>

          `;

        })
        .join("");


  } catch (error) {

    console.error(error);

    document.getElementById("eventsList").innerHTML =
      "<p>Error cargando los datos.</p>";

  }

}


/*
  CREAR GRÁFICO
*/

function createChart(events) {

  const labels = [];

  const values = [];


  /*
    Últimos 30 días
  */

  for (let i = 29; i >= 0; i--) {

    const date = new Date();

    date.setDate(date.getDate() - i);

    date.setHours(0, 0, 0, 0);


    const nextDate = new Date(date);

    nextDate.setDate(nextDate.getDate() + 1);


    /*
      Nombre corto del día
    */

    const label =
      date.toLocaleDateString("es-ES", {
        day: "2-digit",
        month: "2-digit"
      });


    labels.push(label);


    /*
      Contar taps de ese día
    */

    const count =
      events.filter(event => {

        const eventDate =
          new Date(event.created_at);

        return (
          eventDate >= date &&
          eventDate < nextDate
        );

      }).length;


    values.push(count);

  }


  /*
    Eliminar gráfico anterior
  */

  if (tapsChart) {

    tapsChart.destroy();

  }


  /*
    Crear nuevo gráfico
  */

  const ctx =
    document
      .getElementById("tapsChart")
      .getContext("2d");


  tapsChart =
    new Chart(ctx, {

      type: "line",

      data: {

        labels: labels,

        datasets: [

          {

            label: "Taps",

            data: values,

            borderWidth: 3,

            tension: 0.35,

            fill: true,

            pointRadius: 4,

            pointHoverRadius: 7

          }

        ]

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,


        plugins: {

          legend: {

            display: false

          }

        },


        scales: {

          y: {

            beginAtZero: true,

            ticks: {

              precision: 0

            },

            grid: {

              color: "rgba(255,255,255,0.08)"

            }

          },


          x: {

            grid: {

              color: "rgba(255,255,255,0.05)"

            }

          }

        }

      }

    });

}


/*
  CARGAR AL ABRIR
*/

loadData();

</script>

</body>
</html>
