<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - Tzura Steak House</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #333;
    }

    .card-title {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .number {
      font-size: 38px;
      font-weight: bold;
    }

    .events {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #333;
    }

    .events h2 {
      margin-top: 0;
    }

    .event {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid #333;
    }

    .event:last-child {
      border-bottom: none;
    }

    .event-date {
      color: #aaa;
      font-size: 14px;
    }

    .refresh {
      margin-top: 25px;
      padding: 12px 20px;
      background: #b08d57;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .refresh:hover {
      opacity: 0.9;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Tzura Steak House</h1>

  <div class="subtitle">
    Dashboard de NFC
  </div>

  <div class="cards">

    <div class="card">
      <div class="card-title">
        📲 Taps totales
      </div>

      <div class="number" id="totalTaps">
        -
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        📅 Taps hoy
      </div>

      <div class="number" id="todayTaps">
        -
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        📆 Últimos 7 días
      </div>

      <div class="number" id="weekTaps">
        -
      </div>
    </div>


    <div class="card">
      <div class="card-title">
        📈 Últimos 30 días
      </div>

      <div class="number" id="monthTaps">
        -
      </div>
    </div>

  </div>


  <div class="events">

    <h2>Últimos taps</h2>

    <div id="eventsList">
      Cargando...
    </div>

    <button class="refresh" onclick="loadData()">
      🔄 Actualizar
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://qcvhxrudzjlgqlhvnkkl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OpfoWwYD2lvC9dVTT_UT8A_Bvz_GKRw";

const RESTAURANT =
  "Tzura Steak House";


async function loadData() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/nfc_events?restaurant=eq.${encodeURIComponent(RESTAURANT)}&event=eq.nfc_tap&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );


    const events = await response.json();


    if (!Array.isArray(events)) {
      throw new Error("No se pudieron cargar los datos");
    }


    const now = new Date();


    const todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);


    const weekStart = new Date();
    weekStart.setDate(now.getDate() - 7);


    const monthStart = new Date();
    monthStart.setDate(now.getDate() - 30);


    const todayEvents = events.filter(event =>
      new Date(event.created_at) >= todayStart
    );


    const weekEvents = events.filter(event =>
      new Date(event.created_at) >= weekStart
    );


    const monthEvents = events.filter(event =>
      new Date(event.created_at) >= monthStart
    );


    document.getElementById("totalTaps").textContent =
      events.length;


    document.getElementById("todayTaps").textContent =
      todayEvents.length;


    document.getElementById("weekTaps").textContent =
      weekEvents.length;


    document.getElementById("monthTaps").textContent =
      monthEvents.length;


    const list =
      document.getElementById("eventsList");


    if (events.length === 0) {

      list.innerHTML =
        "<p>No hay taps registrados todavía.</p>";

      return;

    }


    list.innerHTML = events
      .slice(0, 20)
      .map(event => {

        const date =
          new Date(event.created_at);

        return `
          <div class="event">

            <div>
              📲 NFC tap
            </div>

            <div class="event-date">
              ${date.toLocaleString("es-ES")}
            </div>

          </div>
        `;

      })
      .join("");


  } catch (error) {

    console.error(error);

    document.getElementById("eventsList").innerHTML =
      "<p>Error cargando los datos.</p>";

  }

}


loadData();

</script>

</body>
</html>
