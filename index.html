<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tzura Steak House</title>
</head>

<body>

<script>
  const SUPABASE_URL =
    "https://qcvhxrudzjlgqlhvnkkl.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_OpfoWwYD2lvC9dVTT_UT8A_Bvz_GKRw";

  // Enlace DIRECTO a escribir una reseña de Tzura
  const REVIEW_URL =
    "https://search.google.com/local/writereview?placeid=ChIJJViIJlyjpBIRjPgkrfFNLKU";

  // Registrar el toque NFC
  fetch(`${SUPABASE_URL}/rest/v1/nfc_events`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Prefer": "return=minimal"
    },
    body: JSON.stringify({
      restaurant: "Tzura Steak House",
      event: "nfc_tap"
    })
  })
  .finally(() => {
    // Ir directamente al formulario de reseña
    window.location.href = REVIEW_URL;
  });
</script>

</body>
</html>
