<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tzura Steak House</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 400px;
      padding: 30px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
      font-size: 17px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 30px;
      background: #fff;
      color: #111;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Tzura Steak House</h1>

  <p>¿Disfrutaste tu experiencia?</p>

  <p>Déjanos tu opinión en Google ⭐</p>

  <a
    class="button"
    href="https://www.google.com/search?q=Tzura+Steak+House+Barcelona"
    target="_blank">
    ⭐ Dejar una reseña
  </a>

</div>

<script>

const SUPABASE_URL = "https://qcvhxrudzjlgqlhvnkkl.supabase.co";

const SUPABASE_KEY = "sb_publishable_OpfoWwYD2lvC9dVTT_UT8A_Bvz_GKRw";

fetch(`${SUPABASE_URL}/rest/v1/nfc_stats`, {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Prefer": "return=minimal"
  },
  body: JSON.stringify({
    restaurant: "Tzura Steak House",
    taps: 1,
    reviews: 0
  })
})
.then(response => {
  if (!response.ok) {
    console.log("Error registrando el toque:", response.status);
  } else {
    console.log("Toque NFC registrado correctamente");
  }
})
.catch(error => {
  console.log("Error:", error);
});

</script>

</body>
</html>
