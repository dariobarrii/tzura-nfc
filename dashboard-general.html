<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard General - NFC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 40px auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 25px;
    }

    .card-title {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .number {
      font-size: 38px;
      font-weight: bold;
    }

    .section {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .section h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      text-align: left;
      color: #aaa;
      font-size: 14px;
      padding: 15px 10px;
      border-bottom: 1px solid #333;
    }

    td {
      padding: 18px 10px;
      border-bottom: 1px solid #333;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .restaurant {
      font-weight: bold;
    }

    .tap-number {
      font-weight: bold;
      font-size: 18px;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 400px;
    }

    .refresh {
      margin-top: 5px;
      padding: 12px 20px;
      background: #b08d57;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .refresh:hover {
      opacity: 0.9;
    }

    .status {
      color: #aaa;
      margin-top: 15px;
      font-size: 14px;
    }

    .error {
      color: #ff7777;
    }

    @media (max-width: 700px) {
      .container {
        width: 95%;
        margin: 25px auto;
      }

      h1 {
        font-size: 26px;
      }

      .chart-container {
        height: 300px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🏪 Dashboard General</h1>

  <div class="subtitle">
    Estadísticas de todas las tarjetas NFC
  </div>


  <!-- RESUMEN GENERAL -->

  <div class="summary">

    <div class="card">
      <div class="card-title">🏪 Restaurantes</div>
      <div class="number" id="totalRestaurants">-</div>
    </div>

    <div class="card">
      <div class="card-title">📲 Taps totales</div>
      <div class="number" id="totalTaps">-</div>
    </div>

    <div class="card">
      <div class="card-title">📅 Taps hoy</div>
      <div class="number" id="todayTaps">-</div>
    </div>

    <div class="card">
      <div class="card-title">📈 Taps últimos 30 días</div>
      <div class="number" id="monthTaps">-</div>
    </div>

  </div>


  <!-- TABLA -->

  <div class="section">

    <h2>📋 Restaurantes</h2>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Restaurante</th>
            <th>Taps totales</th>
            <th>Hoy</th>
            <th>7 días</th>
            <th>30 días</th>
          </tr>
        </thead>

        <tbody id="restaurantsTable">

          <tr>
            <td colspan="5">
              Cargando...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>


  <!-- GRÁFICO -->

  <div class="section">

    <h2>📊 Comparación de restaurantes</h2>

    <div class="chart-container">
      <canvas id="restaurantsChart"></canvas>
    </div>

  </div>


  <button
    class="refresh"
    onclick="loadData()">

    🔄 Actualizar

  </button>


  <div
    class="status"
    id="status">

  </div>

</div>


<!-- CHART.JS -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>

const SUPABASE_URL =
  "https://qcvhxrudzjlgqlhvnkkl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OpfoWwYD2lvC9dVTT_UT8A_Bvz_GKRw";

let restaurantsChart = null;


/*
  CARGAR DATOS
*/

async function loadData() {

  const status =
    document.getElementById("status");

  status.textContent =
    "Cargando datos...";


  try {

    /*
      IMPORTANTE:

      No filtramos por event.

      Traemos todos los registros de nfc_events.
    */

    const response = await fetch(

      `${SUPABASE_URL}/rest/v1/nfc_events?select=*&order=created_at.desc`,

      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }

      }

    );


    if (!response.ok) {

      throw new Error(
        `Supabase respondió ${response.status}`
      );

    }


    const events =
      await response.json();


    if (!Array.isArray(events)) {

      throw new Error(
        "La respuesta de Supabase no es válida"
      );

    }


    console.log(
      "Eventos recibidos:",
      events
    );


    /*
      FECHAS
    */

    const now =
      new Date();


    const todayStart =
      new Date();

    todayStart.setHours(
      0,
      0,
      0,
      0
    );


    const weekStart =
      new Date();

    weekStart.setDate(
      weekStart.getDate() - 7
    );


    const monthStart =
      new Date();

    monthStart.setDate(
      monthStart.getDate() - 30
    );


    /*
      RESTAURANTES

      Detectamos automáticamente
      todos los nombres existentes.
    */

    const restaurantNames =
      [
        ...new Set(

          events
            .map(event => event.restaurant)
            .filter(
              name =>
                name &&
                name.trim() !== ""
            )

        )
      ];


    restaurantNames.sort();


    /*
      RESUMEN GENERAL
    */

    const todayEvents =
      events.filter(event => {

        return (
          event.event === "nfc_tap" &&
          new Date(event.created_at)
            >= todayStart
        );

      });


    const monthEvents =
      events.filter(event => {

        return (
          event.event === "nfc_tap" &&
          new Date(event.created_at)
            >= monthStart
        );

      });


    /*
      MOSTRAR RESUMEN
    */

    document.getElementById(
      "totalRestaurants"
    ).textContent =
      restaurantNames.length;


    const tapEvents =
      events.filter(
        event =>
          event.event === "nfc_tap"
      );


    document.getElementById(
      "totalTaps"
    ).textContent =
      tapEvents.length;


    document.getElementById(
      "todayTaps"
    ).textContent =
      todayEvents.length;


    document.getElementById(
      "monthTaps"
    ).textContent =
      monthEvents.length;


    /*
      TABLA
    */

    const table =
      document.getElementById(
        "restaurantsTable"
      );


    if (restaurantNames.length === 0) {

      table.innerHTML = `

        <tr>
          <td colspan="5">
            No hay restaurantes registrados.
          </td>
        </tr>

      `;

      status.textContent =
        "Supabase respondió correctamente, pero no hay restaurantes.";

      return;

    }


    /*
      GENERAR FILAS
    */

    table.innerHTML =
      restaurantNames
        .map(name => {

          const restaurantEvents =
            events.filter(event => {

              return (
                event.restaurant === name &&
                event.event === "nfc_tap"
              );

            });


          const restaurantToday =
            restaurantEvents.filter(event => {

              return (
                new Date(event.created_at)
                >= todayStart
              );

            });


          const restaurantWeek =
            restaurantEvents.filter(event => {

              return (
                new Date(event.created_at)
                >= weekStart
              );

            });


          const restaurantMonth =
            restaurantEvents.filter(event => {

              return (
                new Date(event.created_at)
                >= monthStart
              );

            });


          return `

            <tr>

              <td class="restaurant">
                ${escapeHtml(name)}
              </td>

              <td class="tap-number">
                ${restaurantEvents.length}
              </td>

              <td>
                ${restaurantToday.length}
              </td>

              <td>
                ${restaurantWeek.length}
              </td>

              <td>
                ${restaurantMonth.length}
              </td>

            </tr>

          `;

        })
        .join("");


    /*
      CREAR GRÁFICO
    */

    createChart(
      restaurantNames,
      events
    );


    /*
      ESTADO
    */

    status.textContent =
      `Última actualización: ${
        new Date().toLocaleString("es-ES")
      }`;


  } catch (error) {

    console.error(
      "Error:",
      error
    );


    document.getElementById(
      "restaurantsTable"
    ).innerHTML = `

      <tr>

        <td colspan="5" class="error">

          ❌ Error cargando los datos.

        </td>

      </tr>

    `;


    status.textContent =
      error.message;

  }

}


/*
  CREAR GRÁFICO
*/

function createChart(
  restaurantNames,
  events
) {


  const values =
    restaurantNames.map(name => {

      return events.filter(event => {

        return (
          event.restaurant === name &&
          event.event === "nfc_tap"
        );

      }).length;

    });


  /*
    Eliminar gráfico anterior
  */

  if (restaurantsChart) {

    restaurantsChart.destroy();

  }


  /*
    Crear gráfico
  */

  const canvas =
    document.getElementById(
      "restaurantsChart"
    );


  const ctx =
    canvas.getContext("2d");


  restaurantsChart =
    new Chart(ctx, {

      type: "bar",

      data: {

        labels: restaurantNames,

        datasets: [

          {

            label: "Taps totales",

            data: values,

            borderWidth: 1

          }

        ]

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,


        plugins: {

          legend: {

            display: false

          }

        },


        scales: {

          y: {

            beginAtZero: true,

            ticks: {

              precision: 0

            },

            grid: {

              color:
                "rgba(255,255,255,0.08)"

            }

          },


          x: {

            grid: {

              color:
                "rgba(255,255,255,0.05)"

            }

          }

        }

      }

    });

}


/*
  PROTECCIÓN DE TEXTO
*/

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/*
  INICIAR
*/

loadData();

</script>

</body>
</html>
