<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard General - NFC</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 40px auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 25px;
    }

    .card-title {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .number {
      font-size: 38px;
      font-weight: bold;
    }

    .section {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .section h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      color: #aaa;
      font-size: 14px;
      padding: 15px 10px;
      border-bottom: 1px solid #333;
    }

    td {
      padding: 18px 10px;
      border-bottom: 1px solid #333;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .restaurant {
      font-weight: bold;
    }

    .tap-number {
      font-weight: bold;
      font-size: 18px;
    }

    .chart-container {
      position: relative;
      height: 400px;
    }

    .refresh {
      margin-top: 10px;
      padding: 12px 20px;
      background: #b08d57;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .refresh:hover {
      opacity: 0.9;
    }

    .status {
      color: #aaa;
      margin-top: 15px;
      font-size: 14px;
    }

    @media (max-width: 700px) {

      .container {
        width: 95%;
        margin: 25px auto;
      }

      h1 {
        font-size: 26px;
      }

      table {
        font-size: 13px;
      }

      th,
      td {
        padding: 12px 5px;
      }

      .chart-container {
        height: 300px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <h1>🏪 Dashboard General</h1>

  <div class="subtitle">
    Estadísticas de todas las tarjetas NFC
  </div>


  <!-- RESUMEN GENERAL -->

  <div class="summary">

    <div class="card">

      <div class="card-title">
        🏪 Restaurantes
      </div>

      <div class="number" id="totalRestaurants">
        -
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        📲 Taps totales
      </div>

      <div class="number" id="totalTaps">
        -
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        📅 Taps hoy
      </div>

      <div class="number" id="todayTaps">
        -
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        📈 Taps últimos 30 días
      </div>

      <div class="number" id="monthTaps">
        -
      </div>

    </div>

  </div>


  <!-- TABLA -->

  <div class="section">

    <h2>📋 Restaurantes</h2>

    <table>

      <thead>

        <tr>

          <th>
            Restaurante
          </th>

          <th>
            Taps totales
          </th>

          <th>
            Hoy
          </th>

          <th>
            7 días
          </th>

          <th>
            30 días
          </th>

        </tr>

      </thead>


      <tbody id="restaurantsTable">

        <tr>
          <td colspan="5">
            Cargando...
          </td>
        </tr>

      </tbody>

    </table>

  </div>


  <!-- GRÁFICO -->

  <div class="section">

    <h2>📊 Comparación de restaurantes</h2>

    <div class="chart-container">

      <canvas id="restaurantsChart"></canvas>

    </div>

  </div>


  <button
    class="refresh"
    onclick="loadData()">

    🔄 Actualizar

  </button>


  <div
    class="status"
    id="status">

  </div>


</div>


<!-- CHART.JS -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>

const SUPABASE_URL =
  "https://qcvhxrudzjlgqlhvnkkl.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_OpfoWwYD2lvC9dVTT_UT8A_Bvz_GKRw";


let restaurantsChart = null;


async function loadData() {

  const status =
    document.getElementById("status");

  status.textContent =
    "Cargando datos...";


  try {

    const response = await fetch(

      `${SUPABASE_URL}/rest/v1/nfc_events?event=eq.nfc_tap&order=created_at.desc`,

      {

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`

        }

      }

    );


    const events =
      await response.json();


    if (!Array.isArray(events)) {

      throw new Error(
        "No se pudieron cargar los datos"
      );

    }


    /*
      FECHAS
    */

    const now =
      new Date();


    const todayStart =
      new Date();

    todayStart.setHours(
      0, 0, 0, 0
    );


    const weekStart =
      new Date();

    weekStart.setDate(
      now.getDate() - 7
    );


    const monthStart =
      new Date();

    monthStart.setDate(
      now.getDate() - 30
    );


    /*
      OBTENER RESTAURANTES
    */

    const restaurantNames =
      [
        ...new Set(
          events
            .map(event => event.restaurant)
            .filter(Boolean)
        )
      ];


    /*
      ORDENAR
    */

    restaurantNames.sort();


    /*
      RESUMEN GENERAL
    */

    const todayEvents =
      events.filter(event =>
        new Date(event.created_at)
        >= todayStart
      );


    const monthEvents =
      events.filter(event =>
        new Date(event.created_at)
        >= monthStart
      );


    document.getElementById(
      "totalRestaurants"
    ).textContent =
      restaurantNames.length;


    document.getElementById(
      "totalTaps"
    ).textContent =
      events.length;


    document.getElementById(
      "todayTaps"
    ).textContent =
      todayEvents.length;


    document.getElementById(
      "monthTaps"
    ).textContent =
      monthEvents.length;


    /*
      TABLA
    */

    const table =
      document.getElementById(
        "restaurantsTable"
      );


    if (restaurantNames.length === 0) {

      table.innerHTML = `

        <tr>

          <td colspan="5">

            Todavía no hay restaurantes registrados.

          </td>

        </tr>

      `;

      status.textContent =
        "No hay datos todavía.";

      return;

    }


    table.innerHTML =
      restaurantNames
        .map(name => {

          const restaurantEvents =
            events.filter(
              event =>
                event.restaurant === name
            );


          const restaurantToday =
            restaurantEvents.filter(
              event =>
                new Date(event.created_at)
                >= todayStart
            );


          const restaurantWeek =
            restaurantEvents.filter(
              event =>
                new Date(event.created_at)
                >= weekStart
            );


          const restaurantMonth =
            restaurantEvents.filter(
              event =>
                new Date(event.created_at)
                >= monthStart
            );


          return `

            <tr>

              <td class="restaurant">
                ${escapeHtml(name)}
              </td>

              <td class="tap-number">
                ${restaurantEvents.length}
              </td>

              <td>
                ${restaurantToday.length}
              </td>

              <td>
                ${restaurantWeek.length}
              </td>

              <td>
                ${restaurantMonth.length}
              </td>

            </tr>

          `;

        })
        .join("");


    /*
      GRÁFICO
    */

    createChart(
      restaurantNames,
      events
    );


    status.textContent =
      `Última actualización: ${
        new Date().toLocaleString("es-ES")
      }`;


  } catch (error) {

    console.error(error);

    document.getElementById(
      "restaurantsTable"
    ).innerHTML = `

      <tr>

        <td colspan="5">

          ❌ Error cargando los datos.

        </td>

      </tr>

    `;

    status.textContent =
      "Error conectando con Supabase.";

  }

}


/*
  GRÁFICO
*/

function createChart(
  restaurantNames,
  events
) {

  const values =
    restaurantNames.map(name =>

      events.filter(
        event =>
          event.restaurant === name
      ).length

    );


  if (restaurantsChart) {

    restaurantsChart.destroy();

  }


  const ctx =
    document
      .getElementById(
        "restaurantsChart"
      )
      .getContext("2d");


  restaurantsChart =
    new Chart(ctx, {

      type: "bar",

      data: {

        labels: restaurantNames,

        datasets: [

          {

            label: "Taps totales",

            data: values,

            borderWidth: 1

          }

        ]

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

          legend: {

            display: false

          }

        },


        scales: {

          y: {

            beginAtZero: true,

            ticks: {

              precision: 0

            },

            grid: {

              color:
                "rgba(255,255,255,0.08)"

            }

          },


          x: {

            grid: {

              color:
                "rgba(255,255,255,0.05)"

            }

          }

        }

      }

    });

}


/*
  SEGURIDAD BÁSICA
*/

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/*
  INICIAR
*/

loadData();

</script>

</body>
</html>
